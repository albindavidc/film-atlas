<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="film" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#0A0A0C" />
  
  <g transform="translate(18, 18)">
    <!-- Outer Film Reel Ring -->
    <circle cx="32" cy="32" r="28" stroke="#1E293B" stroke-width="6" fill="none" />
    
    <!-- Cutouts for Film Reel -->
    <path d="M 32 4 L 32 10 M 32 54 L 32 60 M 4 32 L 10 32 M 54 32 L 60 32 M 12 12 L 17 17 M 47 47 L 52 52 M 12 52 L 17 47 M 47 12 L 52 17" stroke="#0A0A0C" stroke-width="4" stroke-linecap="round" />
    
    <!-- Inner Globe Lines -->
    <circle cx="32" cy="32" r="20" stroke="url(#grad)" stroke-width="3" fill="none" />
    <path d="M 12 32 Q 32 12 52 32" stroke="url(#grad)" stroke-width="2" fill="none" />
    <path d="M 12 32 Q 32 52 52 32" stroke="url(#grad)" stroke-width="2" fill="none" />
    <path d="M 32 12 Q 12 32 32 52" stroke="url(#grad)" stroke-width="2" fill="none" />
    <path d="M 32 12 Q 52 32 32 52" stroke="url(#grad)" stroke-width="2" fill="none" />
    
    <!-- Center Dot -->
    <circle cx="32" cy="32" r="3" fill="#FBBF24" />
  </g>
</svg>
